name: Publish Python package

on:
  release:
    types: [published]

permissions: {}

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release commit $(git rev-parse HEAD) is not contained in origin/main" >&2
            exit 1
          fi

      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION=$(python -c 'import re, pathlib; print(re.search(r"^version = \"([^\"]+)\"", pathlib.Path("pyproject.toml").read_text(), re.M).group(1))')
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag ${RELEASE_TAG} does not match pyproject version ${PACKAGE_VERSION}" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"

      - name: Run core tests
        run: uv run pytest tests/test_integrity.py tests/test_server_construction.py -v

      - name: Build package
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Assert expected distribution files
        run: |
          mapfile -t wheels < <(find dist -maxdepth 1 -name '*.whl' | sort)
          mapfile -t sdists < <(find dist -maxdepth 1 -name '*.tar.gz' | sort)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel and one sdist in dist/, found ${#wheels[@]} wheel(s) and ${#sdists[@]} sdist(s)" >&2
            ls -la dist >&2
            exit 1
          fi
          if [[ "${wheels[0]}" != *"-${PACKAGE_VERSION}-"* ]] || [[ "${sdists[0]}" != *"-${PACKAGE_VERSION}.tar.gz" ]]; then
            echo "Distribution filenames do not match package version ${PACKAGE_VERSION}: ${wheels[0]} ${sdists[0]}" >&2
            exit 1
          fi

      - name: Smoke-install the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          OUTPUT=$(/tmp/smoke/bin/alpaca-mcp-server --version)
          echo "$OUTPUT"
          if [[ "$OUTPUT" != *"${PACKAGE_VERSION}"* ]]; then
            echo "Wheel --version output did not contain ${PACKAGE_VERSION}: ${OUTPUT}" >&2
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/alpaca-mcp-server
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
